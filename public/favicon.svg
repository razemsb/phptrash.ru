<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">phptrash</title>
  <desc id="desc">Логотип phptrash — буква P на волнах в стиле командного знака</desc>

  <defs>
    <clipPath id="squircle">
      <rect width="512" height="512" rx="112" ry="112"/>
    </clipPath>

    <linearGradient id="sky" x1="256" y1="0" x2="256" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C9CEF2"/>
      <stop offset="0.42" stop-color="#A9B2E6"/>
      <stop offset="1" stop-color="#8F9BD9"/>
    </linearGradient>

    <linearGradient id="waveMid" x1="40" y1="280" x2="480" y2="470" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7482CC"/>
      <stop offset="1" stop-color="#5C6AB8"/>
    </linearGradient>

    <linearGradient id="waveDeep" x1="0" y1="360" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4454AA"/>
      <stop offset="1" stop-color="#334292"/>
    </linearGradient>

    <filter id="letterSoft" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#24316F" flood-opacity="0.2"/>
    </filter>
  </defs>

  <g clip-path="url(#squircle)">
    <rect width="512" height="512" fill="url(#sky)"/>

    <!-- middle wave -->
    <path
      fill="url(#waveMid)"
      d="M-8 312
         C58 278 124 348 198 332
         C274 314 312 268 384 286
         C448 302 486 340 520 318
         L520 520 L-8 520 Z"
    />

    <!-- front wave -->
    <path
      fill="url(#waveDeep)"
      d="M-8 388
         C54 352 118 412 190 396
         C266 378 314 342 382 358
         C444 372 484 414 520 392
         L520 520 L-8 520 Z"
    />

    <!-- Bold P (same mass as old team E) -->
    <path
      filter="url(#letterSoft)"
      fill="#FFFFFF"
      fill-rule="evenodd"
      d="
        M152 92
        H248
        C338 92 404 150 404 222
        C404 294 338 352 248 352
        H244
        V420
        H152
        V92
        Z

        M244 164
        V280
        H248
        C290 280 324 254 324 222
        C324 190 290 164 248 164
        H244
        Z
      "
    />
  </g>
</svg>
